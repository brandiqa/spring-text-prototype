stages:
  - lint
  - test
  - links

variables:
  CARGO_TERM_COLOR: "always"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.cargo-cache: &cargo-cache
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - target/
      - .cargo/registry/
      - .cargo/git/

lint:rustfmt_clippy:
  stage: lint
  image: clux/muslrust:stable
  <<: *cargo-cache
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings

test:cargo:
  stage: test
  image: rust:slim-bookworm
  <<: *cargo-cache
  needs: ["lint:rustfmt_clippy"]
  script:
    - cargo test --all --locked

links:specs:
  stage: links
  image: debian:bookworm-slim
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl tar && rm -rf /var/lib/apt/lists/*
    - curl -fsSL -o /tmp/lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.21.0/lychee-x86_64-unknown-linux-gnu.tar.gz
    - tar -xzf /tmp/lychee.tar.gz -C /tmp
    - install -m 0755 /tmp/lychee*/lychee /usr/local/bin/lychee
    - lychee --no-config --include-fragments --verbose --no-progress specs/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
 
